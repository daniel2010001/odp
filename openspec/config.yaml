# SDD configuration — odp (Plataforma de Datos Abiertos UMSS)
#
# Generated by gentle-ai sdd-init on 2026-09-13. Machine-readable SDD context.
# Canonical human-maintained sources stay: AGENTS.md, BACKLOG.md, PRD.md,
# design-system/datos-umss/README.md and openspec/specs/<capability>/spec.md.
#
# IMPORTANT: this repo has NO OpenSpec CLI installed. The openspec/ layout is
# maintained BY HAND. Spec promotion (delta -> main) and archiving are manual.
strict_tdd: true
context: |
  odp is a SvelteKit 2 + Svelte 5 (runes) + TailwindCSS 4 + bits-ui data portal for UMSS
  ("Plataforma de Datos Abiertos UMSS"). TypeScript is strict and the package manager is
  pnpm 10.12.1 (lockfile committed). Biome 2 is the linter and formatter.

  The backend is CKAN 2.11 running HEADLESS: only its REST action API is used, through the
  same-origin /api/ proxy. The portal owns all UI, including administration. CKAN's native
  web UI is accepted only as an operational crutch during v0 (PRD §3, §7, §10).

  Detected markers: package.json, tsconfig.json, pnpm package manager, GitHub Actions.
  Additional evidence: CI (.github/workflows/ci.yml) runs lint + check + test on Node 22;
  Biome is configured in biome.json; Vitest is configured in vitest.config.ts.
  Primary test command: pnpm test.

  Unit tests: Vitest (pnpm test).
  Integration tests: none as a separate runner. Component and API tests run under Vitest
  with jsdom and @testing-library/svelte; there is no distinct integration command.
  E2E tests: none. No Playwright or Cypress exists; dev-stack end-to-end checks are manual
  scripts run against the dockerized CKAN instance, not part of pnpm test.

  Language conventions: OpenSpec artifacts (proposal, specs, design, tasks, reports) are
  written in ENGLISH, matching the archived changes and the canonical specs. User-facing
  docs (AGENTS.md, BACKLOG.md, PRD.md, design system README) are in Spanish. Code
  identifiers and commit messages are in English.

  Artifact layout (manual, no CLI):
  - Canonical specs: openspec/specs/<capability>/spec.md (existing capabilities:
    authentication, dataset-publishing, dataset-resource-listing, organizations,
    resource-detail-view).
  - Changes in flight: openspec/changes/<YYYY-MM-DD>-<name>/.
  - Closed changes: openspec/changes/archive/<YYYY-MM-DD>-<name>/ (moved by hand).
  - The expected artifact set of an archived change is: proposal.md, design.md, tasks.md,
    specs/<capability>/spec.md, apply-progress.md, verify-report.md, archive-report.md.
  - BACKLOG.md is the single source of pending work; closed items are removed from it
    (git keeps the history). Promote/appendix items live there, not in ad-hoc files.

  UI workflow convention (AGENTS.md rule 8): for interface work the agent proposes a
  concrete design in a /dev/<page> playground, the user reviews and iterates there, and
  only then is it promoted to the real page and the playground deleted.
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
    format: "GIVEN/WHEN/THEN"
    canonical_path: "openspec/specs/<capability>/spec.md"
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
    review_budget_lines: 400
  apply:
    test_command: "pnpm test"
    strict_tdd: true
    single_test_command: "pnpm vitest run <test-file-path>"
  verify:
    test_command: "pnpm test"
    also_run:
      - "pnpm check"
      - "pnpm lint"
      - "pnpm build"
  sync:
    manual: true
    note: "No OpenSpec CLI. Promote spec deltas by editing openspec/specs/<capability>/spec.md directly; record the sync in the archive report."
  archive:
    manual: true
    layout: "openspec/changes/archive/<YYYY-MM-DD>-<name>/"
    required_artifacts:
      - proposal.md
      - design.md
      - tasks.md
      - specs/
      - apply-progress.md
      - verify-report.md
      - archive-report.md
testing:
  detected: 2026-09-13
  runner:
    command: "pnpm test"
    framework: "Vitest"
    version: "^4.1.11"
    config: "vitest.config.ts"
    setup: "src/test-setup.ts"
    environment: "jsdom"
    globals: true
    include: "src/**/*.{test,spec}.{js,ts}"
    single_file: "pnpm vitest run <test-file-path>"
  layers:
    unit: "Vitest"
    integration: ""
    e2e: ""
  commands:
    unit:
      - scope: "."
        command: "pnpm test"
        framework: "Vitest"
    integration: []
    e2e: []
  component_testing:
    library: "@testing-library/svelte"
    matchers: "@testing-library/jest-dom/vitest"
    note: "svelteTesting() plugin in vitest.config.ts forces browser resolution; runes mode is forced for project files and left legacy for node_modules."
  setup_notes:
    - "src/test-setup.ts provides a deterministic in-memory localStorage (jsdom 30 does not expose it)."
    - "src/test-setup.ts stubs window.matchMedia (jsdom 30 does not implement it)."
    - "$app/navigation and $app/stores are aliased to stubs in src/test/mocks/app/."
  baseline:
    date: 2026-09-13
    files: 30
    tests: 301
    status: "all passing (pnpm test exit 0)"
  coverage:
    command: ""
    commands: []
quality:
  lint: "pnpm lint"
  lint_commands:
    - scope: "."
      command: "pnpm lint"
      framework: "Biome"
  typecheck: "pnpm check"
  typecheck_commands:
    - scope: "."
      command: "pnpm check"
      framework: "svelte-check"
  format: "pnpm run format"
  format_commands:
    - scope: "."
      command: "pnpm run format"
      framework: "Biome"
